---
# Playbook: cria organizações, times (Gateway) e perfis RBAC customizados (Controller).
#
# No AAP 2.7 as permissões awx.* (credential, inventory, project, templates)
# existem na API do Controller — não no Gateway. Por isso:
#   - organizações e times → ansible.platform (Gateway)
#   - role definitions + assignments → /api/controller/v2/ (via Gateway URL)
#
# Pré-requisitos:
#   ansible-galaxy collection install -r requirements.yml
#   cp vars/aap_auth.yml.example vars/aap_auth.yml   # e preencher token
#
# Execução:
#   ansible-playbook create_rbac_perfis.yml
#
# Auth por variáveis de ambiente (sem aap_auth.yml):
#   export AAP_HOSTNAME='https://...'
#   export AAP_TOKEN='...'
#   ansible-playbook create_rbac_perfis.yml

- name: Criar organizações e perfis RBAC no Ansible Automation Platform
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false

  vars_files:
    - vars/rbac.yml

  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "{{ aap_hostname }}"
      aap_token: "{{ aap_token }}"
      aap_validate_certs: "{{ aap_validate_certs }}"

  pre_tasks:
    - name: Verificar se vars/aap_auth.yml existe
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/aap_auth.yml"
      register: aap_auth_file

    - name: Carregar credenciais do Gateway (arquivo opcional)
      ansible.builtin.include_vars:
        file: vars/aap_auth.yml
      when: aap_auth_file.stat.exists

    - name: Resolver autenticação (arquivo, vars ou ambiente)
      ansible.builtin.set_fact:
        aap_hostname: "{{ aap_hostname | default(lookup('env', 'AAP_HOSTNAME'), true) }}"
        aap_token: "{{ aap_token | default(lookup('env', 'AAP_TOKEN'), true) }}"
        aap_validate_certs: "{{ aap_validate_certs | default(lookup('env', 'AAP_VALIDATE_CERTS') | default(true, true), true) }}"

    - name: Validar parâmetros de autenticação
      ansible.builtin.assert:
        that:
          - aap_hostname | default('') | length > 0
          - aap_token | default('') | length > 0
        fail_msg: >-
          Defina aap_hostname e aap_token em vars/aap_auth.yml
          (veja vars/aap_auth.yml.example) ou via AAP_HOSTNAME / AAP_TOKEN.

    - name: Definir endpoints e headers da API do Controller
      ansible.builtin.set_fact:
        aap_controller_api: "{{ aap_hostname | regex_replace('/$', '') }}/api/controller/v2"
        aap_api_headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: application/json

    - name: Expandir matriz de times (organização × domínio × papel)
      ansible.builtin.set_fact:
        aap_team_matrix: >-
          {%- set ns = namespace(teams=[]) -%}
          {%- for org in aap_organizations -%}
            {%- for team in org.teams -%}
              {%- for role in org.roles -%}
                {%- set _ = ns.teams.append({
                      'organization': org.name,
                      'name': team ~ '-' ~ role,
                      'domain': team,
                      'role_definition': role,
                      'description': 'Time ' ~ team ~ ' com perfil ' ~ role
                    }) -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.teams }}

  tasks:
    - name: Garantir organizações (Gateway)
      ansible.platform.organization:
        name: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ aap_organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Garantir times por organização, domínio e perfil (Gateway)
      ansible.platform.team:
        name: "{{ item.name }}"
        description: "{{ item.description }} ({{ item.organization }})"
        organization: "{{ item.organization }}"
        state: present
      loop: "{{ aap_team_matrix }}"
      loop_control:
        label: "{{ item.organization }}/{{ item.name }}"
      register: team_results

    - name: Buscar role definitions no Controller por nome
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_definitions/?name={{ item.name | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_role_definitions }}"
      loop_control:
        label: "{{ item.name }}"
      register: controller_rd_lookup

    - name: Criar role definitions ausentes no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_definitions/"
        method: POST
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [201, 400, 403]
        body_format: json
        body:
          name: "{{ item.item.name }}"
          description: "{{ item.item.description | default('') }}"
          content_type: "{{ item.item.content_type }}"
          permissions: "{{ item.item.permissions }}"
      loop: "{{ controller_rd_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: >-
        (item.json.results
         | selectattr('name', 'equalto', item.item.name)
         | list | length) == 0
      register: controller_rd_created

    - name: Falhar com detalhe se a criação de role definition for rejeitada
      ansible.builtin.fail:
        msg: >-
          Controller rejeitou a role definition '{{ item.item.item.name }}'
          (HTTP {{ item.status }}): {{ item.json | default(item.msg) }}
      loop: "{{ controller_rd_created.results }}"
      loop_control:
        label: "{{ item.item.item.name | default('skipped') }}"
      when:
        - not (item.skipped | default(false))
        - item.status | default(0) != 201

    - name: Atualizar role definitions existentes no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_definitions/{{ (item.json.results | selectattr('name', 'equalto', item.item.name) | first).id }}/"
        method: PATCH
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200, 400, 403]
        body_format: json
        body:
          description: "{{ item.item.description | default('') }}"
          permissions: "{{ item.item.permissions }}"
      loop: "{{ controller_rd_lookup.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - >-
          (item.json.results
           | selectattr('name', 'equalto', item.item.name)
           | list | length) > 0
        - >-
          ((item.json.results | selectattr('name', 'equalto', item.item.name) | first).permissions | sort)
          != (item.item.permissions | sort)
      register: controller_rd_updated

    - name: Falhar com detalhe se a atualização de role definition for rejeitada
      ansible.builtin.fail:
        msg: >-
          Controller rejeitou o update da role definition '{{ item.item.item.name }}'
          (HTTP {{ item.status }}): {{ item.json | default(item.msg) }}
      loop: "{{ controller_rd_updated.results }}"
      loop_control:
        label: "{{ item.item.item.name | default('skipped') }}"
      when:
        - not (item.skipped | default(false))
        - item.status | default(0) != 200

    - name: Reindexar role definitions no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_definitions/?name={{ item.name | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_role_definitions }}"
      loop_control:
        label: "{{ item.name }}"
      register: controller_rd_reindex

    - name: Montar mapa nome → role definition
      ansible.builtin.set_fact:
        controller_rd_by_name: >-
          {%- set ns = namespace(d={}) -%}
          {%- for r in controller_rd_reindex.results -%}
            {%- set matches = r.json.results
                 | selectattr('name', 'equalto', r.item.name) | list -%}
            {%- if matches | length > 0 -%}
              {%- set _ = ns.d.update({r.item.name: matches[0]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.d }}

    - name: Validar que todos os perfis existem no Controller
      ansible.builtin.assert:
        that:
          - item.name in controller_rd_by_name
        fail_msg: >-
          Role definition '{{ item.name }}' não encontrada no Controller
          após create/update. Verifique se as permissões awx.* são
          aceitas em /api/controller/v2/role_definitions/.
      loop: "{{ aap_role_definitions }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Resolver organizações no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/organizations/?name={{ item.name | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_organizations }}"
      loop_control:
        label: "{{ item.name }}"
      register: controller_orgs
      retries: 20
      delay: 3
      until: controller_orgs.json.count | default(0) > 0

    - name: Indexar organizações do Controller por nome
      ansible.builtin.set_fact:
        controller_org_by_name: >-
          {%- set ns = namespace(d={}) -%}
          {%- for r in controller_orgs.results -%}
            {%- set matches = r.json.results
                 | selectattr('name', 'equalto', r.item.name) | list -%}
            {%- if matches | length > 0 -%}
              {%- set _ = ns.d.update({r.item.name: matches[0]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.d }}

    - name: Resolver times no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/teams/?name={{ item.name | urlencode }}&organization__name={{ item.organization | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_team_matrix }}"
      loop_control:
        label: "{{ item.organization }}/{{ item.name }}"
      register: controller_teams
      retries: 20
      delay: 3
      until: controller_teams.json.count | default(0) > 0

    - name: Verificar assignments existentes no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_team_assignments/?role_definition={{ controller_rd_by_name[item.item.role_definition].id }}&team={{ item.json.results[0].id }}&object_id={{ controller_org_by_name[item.item.organization].id }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ controller_teams.results }}"
      loop_control:
        label: "{{ item.item.organization }}/{{ item.item.name }} → {{ item.item.role_definition }}"
      register: controller_assignments_check
      when:
        - item.json is defined
        - item.json.count | default(0) > 0

    - name: Atribuir perfis RBAC aos times no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_team_assignments/"
        method: POST
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [201]
        body_format: json
        body:
          role_definition: "{{ controller_rd_by_name[item.item.item.role_definition].id }}"
          team: "{{ item.item.json.results[0].id }}"
          object_id: "{{ controller_org_by_name[item.item.item.organization].id | string }}"
      loop: "{{ controller_assignments_check.results }}"
      loop_control:
        label: "{{ item.item.item.organization }}/{{ item.item.item.name }} → {{ item.item.item.role_definition }}"
      when:
        - not (item.skipped | default(false))
        - item.json.count | default(1) == 0
      register: controller_assignments_created

    - name: Resumo
      ansible.builtin.debug:
        msg:
          - "Organizações (Gateway): {{ aap_organizations | map(attribute='name') | list }}"
          - "Perfis RBAC (Controller): {{ aap_role_definitions | map(attribute='name') | list }}"
          - "Times criados/atualizados: {{ team_results.results | length }}"
          - >-
            Assignments novos:
            {{ controller_assignments_created.results
               | default([])
               | rejectattr('skipped', 'defined')
               | list | length }}
          - >-
            Adicione usuários aos times {domínio}-{papel}
            (ex.: BD-Administrador, DNS-Suporte) de cada organização
            para conceder o perfil correspondente.
          - >-
            Acesso platform-wide (superusuário) continua sendo o papel
            gerenciado 'Platform Admin', atribuído diretamente a usuários
            — não pode ser atribuído a times.
