---
# Role definitions customizadas (content_type: shared.organization).
# Escopo: credenciais, inventário, projetos e templates da organização.
#
# Observação AAP 2.7: permissões awx.* vivem no Controller. Se a criação
# falhar com "Failed to sync resource to resource server", a sync
# Controller→Gateway ainda não aceita essas RoleDefinitions neste ambiente.
aap_role_definitions:
  - name: Administrador
    description: Acesso total à organização
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - shared.change_organization
      - shared.delete_organization
      - shared.member_organization
      - shared.view_team
      - shared.change_team
      - shared.delete_team
      - shared.member_team
      - shared.add_team
      - awx.view_credential
      - awx.change_credential
      - awx.delete_credential
      - awx.add_credential
      - awx.use_credential
      - awx.view_inventory
      - awx.change_inventory
      - awx.delete_inventory
      - awx.add_inventory
      - awx.use_inventory
      - awx.adhoc_inventory
      - awx.update_inventory
      - awx.view_project
      - awx.change_project
      - awx.delete_project
      - awx.add_project
      - awx.use_project
      - awx.update_project
      - awx.view_jobtemplate
      - awx.change_jobtemplate
      - awx.delete_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.delete_workflowjobtemplate
      - awx.add_workflowjobtemplate
      - awx.execute_workflowjobtemplate
      - awx.approve_workflowjobtemplate

  - name: Suporte
    description: Acesso de leitura e execução em toda a organização
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.use_credential
      - awx.view_inventory
      - awx.use_inventory
      - awx.view_project
      - awx.use_project
      - awx.view_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_workflowjobtemplate
      - awx.execute_workflowjobtemplate

  - name: Operador
    description: Acesso de leitura, atualização e execução na organização
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.change_credential
      - awx.use_credential
      - awx.view_inventory
      - awx.change_inventory
      - awx.use_inventory
      - awx.update_inventory
      - awx.view_project
      - awx.change_project
      - awx.use_project
      - awx.update_project
      - awx.view_jobtemplate
      - awx.change_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_workflowjobtemplate
      - awx.change_workflowjobtemplate
      - awx.execute_workflowjobtemplate

  - name: Auditor
    description: Acesso de leitura na organização
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.view_inventory
      - awx.view_project
      - awx.view_jobtemplate
      - awx.view_workflowjobtemplate

  - name: Desenvolvedor
    description: >-
      Leitura e execução em credenciais e inventário; atualização de
      projetos; execução de templates na organização
    content_type: shared.organization
    permissions:
      - shared.view_organization
      - awx.view_credential
      - awx.use_credential
      - awx.view_inventory
      - awx.use_inventory
      - awx.view_project
      - awx.change_project
      - awx.use_project
      - awx.update_project
      - awx.view_jobtemplate
      - awx.execute_jobtemplate
      - awx.view_workflowjobtemplate
      - awx.execute_workflowjobtemplate
