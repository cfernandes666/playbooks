---
# Playbook: cria organizações/times (Gateway) e atribui roles gerenciadas (Controller).
#
# No AAP 2.7:
#   - organizações e times → ansible.platform (Gateway)
#   - assignments de roles com awx.* → /api/controller/v2/role_team_assignments/
#
# Roles customizadas com permissões awx.* falham neste ambiente
# ("Failed to sync resource to resource server"): o Controller não consegue
# reverse-sync da RoleDefinition para o Gateway. Por isso o playbook atribui
# roles gerenciadas org-scoped já existentes no Controller.
#
# Pré-requisitos:
#   ansible-galaxy collection install -r requirements.yml
#   cp vars/aap_auth.yml.example vars/aap_auth.yml   # e preencher token
#
# Execução:
#   ansible-playbook create_rbac_perfis.yml
#
# Auth por variáveis de ambiente (sem aap_auth.yml):
#   export AAP_HOSTNAME='https://...'
#   export AAP_TOKEN='...'
#   ansible-playbook create_rbac_perfis.yml

- name: Criar organizações e atribuir perfis RBAC no Ansible Automation Platform
  hosts: localhost
  connection: ansible.platform.http
  gather_facts: false

  vars_files:
    - vars/rbac.yml

  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "{{ aap_hostname }}"
      aap_token: "{{ aap_token }}"
      aap_validate_certs: "{{ aap_validate_certs }}"

  pre_tasks:
    - name: Verificar se vars/aap_auth.yml existe
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/aap_auth.yml"
      register: aap_auth_file

    - name: Carregar credenciais do Gateway (arquivo opcional)
      ansible.builtin.include_vars:
        file: vars/aap_auth.yml
      when: aap_auth_file.stat.exists

    - name: Resolver autenticação (arquivo, vars ou ambiente)
      ansible.builtin.set_fact:
        aap_hostname: "{{ aap_hostname | default(lookup('env', 'AAP_HOSTNAME'), true) }}"
        aap_token: "{{ aap_token | default(lookup('env', 'AAP_TOKEN'), true) }}"
        aap_validate_certs: "{{ aap_validate_certs | default(lookup('env', 'AAP_VALIDATE_CERTS') | default(true, true), true) }}"

    - name: Validar parâmetros de autenticação
      ansible.builtin.assert:
        that:
          - aap_hostname | default('') | length > 0
          - aap_token | default('') | length > 0
        fail_msg: >-
          Defina aap_hostname e aap_token em vars/aap_auth.yml
          (veja vars/aap_auth.yml.example) ou via AAP_HOSTNAME / AAP_TOKEN.

    - name: Definir endpoints e headers da API do Controller
      ansible.builtin.set_fact:
        aap_controller_api: "{{ aap_hostname | regex_replace('/$', '') }}/api/controller/v2"
        aap_api_headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: application/json

    - name: Validar que todos os papéis das orgs existem em aap_role_profiles
      ansible.builtin.assert:
        that:
          - item in aap_role_profiles
        fail_msg: "Papel '{{ item }}' não definido em aap_role_profiles"
      loop: "{{ aap_organizations | map(attribute='roles') | flatten | unique }}"

    - name: Expandir matriz de times (organização × domínio × papel)
      ansible.builtin.set_fact:
        aap_team_matrix: >-
          {%- set ns = namespace(teams=[]) -%}
          {%- for org in aap_organizations -%}
            {%- for team in org.teams -%}
              {%- for role in org.roles -%}
                {%- set _ = ns.teams.append({
                      'organization': org.name,
                      'name': team ~ '-' ~ role,
                      'domain': team,
                      'profile': role,
                      'managed_roles': aap_role_profiles[role].managed_roles,
                      'description': 'Time ' ~ team ~ ' com perfil ' ~ role
                    }) -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.teams }}

    - name: Expandir matriz de assignments (time × managed role)
      ansible.builtin.set_fact:
        aap_assignment_matrix: >-
          {%- set ns = namespace(rows=[]) -%}
          {%- for team in aap_team_matrix -%}
            {%- for managed_role in team.managed_roles -%}
              {%- set _ = ns.rows.append({
                    'organization': team.organization,
                    'team': team.name,
                    'profile': team.profile,
                    'managed_role': managed_role
                  }) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ ns.rows }}

  tasks:
    - name: Garantir organizações (Gateway)
      ansible.platform.organization:
        name: "{{ item.name }}"
        description: "{{ item.description | default(omit) }}"
        state: present
      loop: "{{ aap_organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Garantir times por organização, domínio e perfil (Gateway)
      ansible.platform.team:
        name: "{{ item.name }}"
        description: "{{ item.description }} ({{ item.organization }})"
        organization: "{{ item.organization }}"
        state: present
      loop: "{{ aap_team_matrix }}"
      loop_control:
        label: "{{ item.organization }}/{{ item.name }}"
      register: team_results

    - name: Buscar roles gerenciadas no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_definitions/?name={{ item | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_role_profiles.values() | map(attribute='managed_roles') | flatten | unique }}"
      loop_control:
        label: "{{ item }}"
      register: controller_rd_lookup

    - name: Montar mapa nome → role definition gerenciada
      ansible.builtin.set_fact:
        controller_rd_by_name: >-
          {%- set ns = namespace(d={}) -%}
          {%- for r in controller_rd_lookup.results -%}
            {%- set matches = r.json.results
                 | selectattr('name', 'equalto', r.item) | list -%}
            {%- if matches | length > 0 -%}
              {%- set _ = ns.d.update({r.item: matches[0]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.d }}

    - name: Validar que todas as roles gerenciadas existem no Controller
      ansible.builtin.assert:
        that:
          - item in controller_rd_by_name
        fail_msg: >-
          Role gerenciada '{{ item }}' não encontrada em
          {{ aap_controller_api }}/role_definitions/
      loop: "{{ aap_role_profiles.values() | map(attribute='managed_roles') | flatten | unique }}"

    - name: Resolver organizações no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/organizations/?name={{ item.name | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_organizations }}"
      loop_control:
        label: "{{ item.name }}"
      register: controller_orgs
      retries: 20
      delay: 3
      until: controller_orgs.json.count | default(0) > 0

    - name: Indexar organizações do Controller por nome
      ansible.builtin.set_fact:
        controller_org_by_name: >-
          {%- set ns = namespace(d={}) -%}
          {%- for r in controller_orgs.results -%}
            {%- set matches = r.json.results
                 | selectattr('name', 'equalto', r.item.name) | list -%}
            {%- if matches | length > 0 -%}
              {%- set _ = ns.d.update({r.item.name: matches[0]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.d }}

    - name: Resolver times no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/teams/?name={{ item.name | urlencode }}&organization__name={{ item.organization | urlencode }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_team_matrix }}"
      loop_control:
        label: "{{ item.organization }}/{{ item.name }}"
      register: controller_teams
      retries: 20
      delay: 3
      until: controller_teams.json.count | default(0) > 0

    - name: Indexar times do Controller por org/nome
      ansible.builtin.set_fact:
        controller_team_by_key: >-
          {%- set ns = namespace(d={}) -%}
          {%- for r in controller_teams.results -%}
            {%- set key = r.item.organization ~ '/' ~ r.item.name -%}
            {%- if r.json.count | default(0) > 0 -%}
              {%- set _ = ns.d.update({key: r.json.results[0]}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.d }}

    - name: Verificar assignments existentes no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_team_assignments/?role_definition={{ controller_rd_by_name[item.managed_role].id }}&team={{ controller_team_by_key[item.organization ~ '/' ~ item.team].id }}&object_id={{ controller_org_by_name[item.organization].id }}"
        method: GET
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [200]
      loop: "{{ aap_assignment_matrix }}"
      loop_control:
        label: "{{ item.organization }}/{{ item.team }} → {{ item.managed_role }}"
      register: controller_assignments_check

    - name: Atribuir roles gerenciadas aos times no Controller
      ansible.builtin.uri:
        url: "{{ aap_controller_api }}/role_team_assignments/"
        method: POST
        headers: "{{ aap_api_headers }}"
        validate_certs: "{{ aap_validate_certs | bool }}"
        status_code: [201, 400, 403]
        body_format: json
        body:
          role_definition: "{{ controller_rd_by_name[item.item.managed_role].id }}"
          team: "{{ controller_team_by_key[item.item.organization ~ '/' ~ item.item.team].id }}"
          object_id: "{{ controller_org_by_name[item.item.organization].id | string }}"
      loop: "{{ controller_assignments_check.results }}"
      loop_control:
        label: "{{ item.item.organization }}/{{ item.item.team }} → {{ item.item.managed_role }}"
      when:
        - not (item.skipped | default(false))
        - item.json.count | default(1) == 0
      register: controller_assignments_created

    - name: Falhar com detalhe se o assignment for rejeitado
      ansible.builtin.fail:
        msg: >-
          Controller rejeitou assignment
          {{ item.item.item.organization }}/{{ item.item.item.team }}
          → {{ item.item.item.managed_role }}
          (HTTP {{ item.status }}): {{ item.json | default(item.msg) }}
      loop: "{{ controller_assignments_created.results }}"
      loop_control:
        label: "{{ item.item.item.organization | default('skipped') }}/{{ item.item.item.team | default('') }} → {{ item.item.item.managed_role | default('') }}"
      when:
        - not (item.skipped | default(false))
        - item.status | default(0) != 201

    - name: Resumo
      ansible.builtin.debug:
        msg:
          - "Organizações (Gateway): {{ aap_organizations | map(attribute='name') | list }}"
          - "Perfis: {{ aap_role_profiles.keys() | list }}"
          - "Times criados/atualizados: {{ team_results.results | length }}"
          - "Assignments previstos: {{ aap_assignment_matrix | length }}"
          - >-
            Assignments novos:
            {{ controller_assignments_created.results
               | default([])
               | rejectattr('skipped', 'defined')
               | list | length }}
          - >-
            Adicione usuários aos times {domínio}-{papel}
            (ex.: BD-Administrador, DNS-Suporte) de cada organização
            para conceder o perfil correspondente.
          - >-
            Roles customizadas com awx.* não são criadas neste playbook:
            o Controller falha o reverse-sync para o Gateway
            ('Failed to sync resource to resource server').
